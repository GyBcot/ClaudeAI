name: Cleanup Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel and Delete Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cancel_and_wait() {
            local ID=$1

            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$ID/force-cancel")

            if [[ "$HTTP" == "409" ]]; then
              echo "  Run $ID already completed, skipping cancel"
              return
            fi

            echo "  Force-cancel $ID → HTTP $HTTP, waiting for completed..."

            local MAX=18
            local i=0
            while [[ $i -lt $MAX ]]; do
              sleep 10
              STATUS=$(curl -s \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$ID" | jq -r '.status')
              echo "  [$i] status: $STATUS"
              [[ "$STATUS" == "completed" ]] && break
              ((i++))
            done

            if [[ $i -eq $MAX ]]; then
              echo "  TIMEOUT: run $ID did not complete after $((MAX*10))s"
            fi
          }

          TOTAL_DELETED=0
          PAGE=1

          while true; do
            RUNS=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=100&page=$PAGE")

            COUNT=$(echo "$RUNS" | jq '.workflow_runs | length')

            if [[ "$COUNT" -eq 0 ]]; then
              if [[ $PAGE -eq 1 ]]; then
                echo "No workflow runs available."
                exit 0
              fi
              break
            fi

            echo "$RUNS" | jq -c '.workflow_runs[] | {id, status}' | while read RUN; do
              ID=$(echo "$RUN" | jq -r '.id')
              STATUS=$(echo "$RUN" | jq -r '.status')

              echo "Processing run $ID (status: $STATUS)"

              if [[ "$STATUS" != "completed" ]]; then
                cancel_and_wait "$ID"
              fi

              HTTP_DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$ID")

              if [[ "$HTTP_DEL" == "204" ]]; then
                echo "  ✓ Deleted run $ID"
                ((TOTAL_DELETED++))
              else
                echo "  ✗ Failed to delete run $ID (HTTP $HTTP_DEL)"
              fi
            done

            ((PAGE++))
          done

          if [[ $TOTAL_DELETED -gt 0 ]]; then
            echo "Done. Total $TOTAL_DELETED run(s) deleted."
          else
            echo "Done."
          fi
          